
name: Build Economy Reel

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/reels.json'
      - 'assets/character.png'
      - 'scripts/**'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system tools and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build reel video
        run: python scripts/make_reels.py

      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/reels.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Build economy reel"
            git pull --rebase origin main
            git push
          fi
